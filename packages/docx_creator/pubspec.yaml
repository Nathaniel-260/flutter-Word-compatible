name: docx_creator
description: Create, read, and convert DOCX documents in pure Dart — fluent builder API, HTML/Markdown import and export, PDF export with Unicode fallback fonts, and a DOCX/PDF reader.
version: 1.3.0
repository: https://github.com/alihassan143/flutter-packages
homepage: https://github.com/alihassan143/flutter-packages/tree/main/packages/docx_creator
topics:
  - docx
  - pdf
  - markdown
  - html
  - converter

environment:
  sdk: ^3.0.0

dependencies:
  xml: ^6.6.1
  archive: ^4.0.9
  path: ^1.9.1
  image: ^4.8.0
  markdown: ^7.3.1
  html: ^0.15.6
  http: ^1.6.0
  uuid: ^4.6.0
  equatable: ^2.1.0
  pointycastle: ^4.0.0
  crypto: ^3.0.7
  web: ^1.1.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.2
