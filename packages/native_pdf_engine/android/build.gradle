group = "com.example.native_pdf_engine"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:9.3.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// AGP 9+ can compile Kotlin itself ("built-in Kotlin"), so the standalone
// Kotlin Gradle Plugin no longer needs to be applied there; older AGP (or a
// consumer explicitly opting out via the `android.builtInKotlin` Gradle
// property) still needs it applied explicitly. Mirrors the pattern real
// published plugins (e.g. file_picker) use for this migration - see:
// https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-plugin-authors
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlinProperty = providers.gradleProperty("android.builtInKotlin").orNull
def isBuiltInKotlinEnabled = agpMajor >= 9 &&
        (builtInKotlinProperty == null || builtInKotlinProperty.toBoolean())
def shouldApplyKotlinAndroidPlugin = !isBuiltInKotlinEnabled

apply plugin: "com.android.library"
if (shouldApplyKotlinAndroidPlugin) {
    apply plugin: "kotlin-android"
}

android {
    namespace = "com.example.native_pdf_engine"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    if (shouldApplyKotlinAndroidPlugin) {
        kotlinOptions {
            jvmTarget = JavaVersion.VERSION_17
        }
    }

    sourceSets {
        main.java.srcDirs += ["src/main/java", "src/main/kotlin"]
        test.java.srcDirs += ["src/test/java", "src/test/kotlin"]
    }

    defaultConfig {
        minSdk = 24
        consumerProguardFiles 'consumer-rules.pro'
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
