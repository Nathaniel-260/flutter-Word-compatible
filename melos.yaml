name: htmltopdfwidgets
packages:
  - packages/*

scripts:
  analyze:
    run: |
      melos run analyze:dart
      melos run analyze:flutter

  analyze:dart:
    run: dart analyze .
    exec:
      concurrency: 1
    description: Run dart analyze in a specific package.
    packageFilters:
      flutter: false

  analyze:flutter:
    run: flutter analyze .
    exec:
      concurrency: 1
    description: Run flutter analyze in a specific package.
    packageFilters:
      flutter: true

  test:
    run: |
      melos run test:dart
      melos run test:flutter
      melos run test:flutter:web

  test:dart:
    run: dart test
    exec:
      concurrency: 1
    description: Run dart test in a specific package.
    packageFilters:
      flutter: false
      dirExists: test

  test:flutter:
    run: flutter test
    exec:
      concurrency: 1
    description: Run flutter test in a specific package.
    packageFilters:
      flutter: true
      dirExists: test
      ignore:
        - "docx_creator_showcase"

  test:flutter:web:
    run: flutter test --platform chrome
    exec:
      concurrency: 1
    description: |
      Run flutter test on the chrome platform for web-only packages (no
      android/ios/linux/macos/windows folders), since those unconditionally
      import dart:js_interop/dart:ui_web and can't even compile for the VM
      test platform that `flutter test` otherwise defaults to.
    packageFilters:
      flutter: true
      dirExists: test
      scope:
        - "docx_creator_showcase"

  format:
    run: dart format .
    exec:
      concurrency: 1
    description: Format code in all packages.

  get:
    run: dart pub get
    exec:
      concurrency: 1
    description: Run pub get in all packages.
